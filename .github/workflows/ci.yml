name: CI

# Runs the native `living-docs` CLI (Rust): fmt/clippy/test via the pinned Docker dev
# image (Dockerfile.dev, matching cli/rust-toolchain.toml), then `make check` builds
# the release binary and runs the Living Docs invariant + mermaid checks against the
# example corpus plus the hostile fixtures, on every push and PR. A formatting issue,
# lint warning, failing test, invariant violation, or file-size ratchet violation fails
# the build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version consistency (VERSION ↔ every SKILL.md)
        run: ./scripts/check-version.sh

      - name: File-size ratchet (300-line cap + grandfather baseline)
        run: ./scripts/check-file-size.sh

      - name: cargo fmt --check (cli/, pinned Rust 1.96.0 via Dockerfile.dev)
        run: make cli-fmt

      - name: cargo clippy --all-targets -- -D warnings (cli/)
        run: make cli-clippy

      - name: cargo test (cli/)
        run: make cli-test

      - name: living-docs check — install.sh syntax, docs invariants, mermaid, fixtures
        run: make check

  windows-cli:
    name: Windows CLI compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.96.0 (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Run native docs-check and sealing tests
        run: >-
          cargo test --manifest-path cli/Cargo.toml
          --test check_core --test check_links --test check_mermaid
          --test check_moved_source --test check_size

      - name: Run living-docs-core unit tests
        run: cargo test --manifest-path living-docs-core/Cargo.toml --lib

      - name: Check the example bundle natively
        run: cargo run --quiet --manifest-path cli/Cargo.toml -- check examples/linkly/docs
